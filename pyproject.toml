[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "httk-website"
version = "0.1.0"
description = "The httk.org website, generated with the httk-serve (httk.serve.web) static site generator."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Rickard Armiento", email = "gitcommits@armiento.net" }]
dependencies = [
  "httk-serve @ git+https://github.com/httk/httk-serve@main",
]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.16,<0.17",
  "pyright",
  "mypy",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# TRY002: raising plain Exception is accepted httk style.
# TRY004: the ValueError/TypeError choice is public API; do not churn it.
# BLE001: broad excepts deliberately isolate plugin/loader/handler failures.
ignore = ["TRY002", "TRY004", "BLE001"]

[tool.ruff.format]
# preserve replaces black's skip-string-normalization: existing quote styles are kept.
quote-style = "preserve"

[tool.pyright]
pythonVersion = "3.12"
include = ["serve_dynamic.py", "publish_static.py"]
reportMissingImports = true

[tool.mypy]
python_version = "3.12"
files = ["serve_dynamic.py", "publish_static.py"]
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["httk.serve.web", "httk.serve.web.*"]
ignore_missing_imports = true
